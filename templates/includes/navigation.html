<header class="site-header">
  <nav class="navbar navbar-expand-md navbar-dark" aria-label="Primary navigation">
    <div class="container py-2">
      <a class="navbar-brand site-brand" href="{% url 'news:home' %}">ByteBoard</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#primary-navigation"
        aria-controls="primary-navigation"
        aria-expanded="false"
        aria-label="Open navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="primary-navigation">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
          <li class="nav-item"><a class="nav-link" href="{% url 'news:home' %}">Home</a></li>
          {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'news:post-create' %}">Submit</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:profile' user.username %}">My profile</a>
            </li>
            <li class="nav-item">
              <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-light" type="submit">Log out</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">Register</a></li>
            <li class="nav-item"><a class="btn btn-outline-light" href="{% url 'accounts:login' %}">Log in</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
