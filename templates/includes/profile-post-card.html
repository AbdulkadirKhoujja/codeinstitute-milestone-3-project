<article class="profile-post">
  <p class="eyebrow">{{ post.category.name }}</p>
  <h3><a href="{% url 'news:post-detail' post.pk %}">{{ post.title }}</a></h3>
  {% if is_owner %}<p><span class="badge text-bg-secondary">{{ post.get_status_display }}</span></p>{% endif %}
  <p>{{ post.summary }}</p>
  <time datetime="{{ post.created_at|date:'c' }}">{{ post.created_at|date:"j F Y" }}</time>
  {% if is_owner %}
    <div class="owner-actions" aria-label="Manage {{ post.title }}">
      <a href="{% url 'news:post-update' post.pk %}">Edit</a>
      <a href="{% url 'news:post-delete' post.pk %}">Delete</a>
    </div>
  {% endif %}
</article>
