<article class="comment-card">
  <header class="comment-card__header">
    <a href="{% url 'accounts:profile' comment.author.username %}">{{ comment.author.username }}</a>
    <time datetime="{{ comment.created_at|date:'c' }}">{{ comment.created_at|date:"j F Y, H:i" }}</time>
  </header>
  <div class="comment-card__body">{{ comment.body|linebreaks }}</div>
</article>
