<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title description">
  <title id="title">ByteBoard desktop home page wireframe</title>
  <desc id="description">Planning wireframe showing a header, category navigation, story feed, sidebar, and footer at desktop width.</desc>
  <style>
    .page { fill: #fff; stroke: #222; stroke-width: 2; }
    .region { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .card { fill: #fff; stroke: #777; stroke-width: 2; }
    .line { stroke: #888; stroke-width: 10; stroke-linecap: round; }
    .label { fill: #111; font: 700 20px Arial, sans-serif; }
    .note { fill: #333; font: 16px Arial, sans-serif; }
  </style>
  <rect class="page" x="1" y="1" width="1438" height="1022"/>
  <text class="note" x="32" y="32">PLANNING WIREFRAME — NOT A FINAL SCREENSHOT</text>

  <rect class="region" x="30" y="55" width="1380" height="95"/>
  <text class="label" x="60" y="105">BYTEBOARD</text>
  <rect class="card" x="360" y="78" width="460" height="48"/>
  <text class="note" x="380" y="108">Search stories</text>
  <text class="note" x="1040" y="108">Sign in · Register · Submit</text>

  <rect class="region" x="30" y="165" width="1380" height="58"/>
  <text class="note" x="60" y="201">All · AI · Startups · Development · Cybersecurity · Gadgets · Fintech</text>

  <main>
    <text class="label" x="55" y="275">Latest technology and startup stories</text>
    <rect class="region" x="30" y="295" width="920" height="600"/>

    <g transform="translate(55 325)">
      <rect class="card" width="870" height="155"/>
      <text class="label" x="25" y="38">Story title</text>
      <line class="line" x1="25" y1="67" x2="790" y2="67"/>
      <line class="line" x1="25" y1="92" x2="670" y2="92"/>
      <text class="note" x="25" y="132">Category · author · date · score · comments</text>
    </g>
    <g transform="translate(55 500)">
      <rect class="card" width="870" height="155"/>
      <text class="label" x="25" y="38">Story title</text>
      <line class="line" x1="25" y1="67" x2="790" y2="67"/>
      <line class="line" x1="25" y1="92" x2="610" y2="92"/>
      <text class="note" x="25" y="132">Category · author · date · score · comments</text>
    </g>
    <g transform="translate(55 675)">
      <rect class="card" width="870" height="155"/>
      <text class="label" x="25" y="38">Story title</text>
      <line class="line" x1="25" y1="67" x2="790" y2="67"/>
      <line class="line" x1="25" y1="92" x2="700" y2="92"/>
      <text class="note" x="25" y="132">Category · author · date · score · comments</text>
    </g>

    <aside>
      <rect class="region" x="980" y="295" width="430" height="600"/>
      <text class="label" x="1010" y="340">About ByteBoard</text>
      <line class="line" x1="1010" y1="375" x2="1350" y2="375"/>
      <line class="line" x1="1010" y1="400" x2="1310" y2="400"/>
      <text class="label" x="1010" y="475">Browse categories</text>
      <rect class="card" x="1010" y="500" width="165" height="45"/>
      <rect class="card" x="1190" y="500" width="165" height="45"/>
      <rect class="card" x="1010" y="560" width="165" height="45"/>
      <rect class="card" x="1190" y="560" width="165" height="45"/>
      <rect class="card" x="1010" y="620" width="165" height="45"/>
      <rect class="card" x="1190" y="620" width="165" height="45"/>
    </aside>
  </main>

  <rect class="region" x="30" y="920" width="1380" height="70"/>
  <text class="note" x="60" y="963">Footer: project information · accessibility · repository</text>
</svg>
