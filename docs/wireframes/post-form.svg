<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img" aria-labelledby="title description">
  <title id="title">ByteBoard post form wireframe</title>
  <desc id="description">Planning wireframe showing a responsive single-column create or edit post form with labels, validation region, and actions.</desc>
  <style>
    .page { fill: #fff; stroke: #222; stroke-width: 2; }
    .region { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .field { fill: #fff; stroke: #777; stroke-width: 2; }
    .label { fill: #111; font: 700 18px Arial, sans-serif; }
    .note { fill: #333; font: 15px Arial, sans-serif; }
  </style>
  <rect class="page" x="1" y="1" width="898" height="1048"/>
  <text class="note" x="28" y="30">PLANNING WIREFRAME — NOT A FINAL SCREENSHOT</text>
  <rect class="region" x="25" y="50" width="850" height="70"/>
  <text class="label" x="50" y="92">BYTEBOARD</text>
  <text class="note" x="710" y="92">Account · Cancel</text>

  <main>
    <rect class="region" x="100" y="155" width="700" height="835"/>
    <text class="label" x="140" y="205">Create a story / Edit your story</text>
    <text class="note" x="140" y="235">Required fields are marked in text. Errors appear beside fields.</text>

    <text class="label" x="140" y="285">Title (required)</text>
    <rect class="field" x="140" y="300" width="620" height="48"/>
    <text class="label" x="140" y="390">Summary (required)</text>
    <rect class="field" x="140" y="405" width="620" height="85"/>
    <text class="label" x="140" y="532">Article URL (required)</text>
    <rect class="field" x="140" y="547" width="620" height="48"/>
    <text class="label" x="140" y="637">Content (required)</text>
    <rect class="field" x="140" y="652" width="620" height="120"/>
    <text class="label" x="140" y="814">Category (required)</text>
    <rect class="field" x="140" y="829" width="290" height="48"/>
    <text class="label" x="470" y="814">Status (required)</text>
    <rect class="field" x="470" y="829" width="290" height="48"/>
    <rect class="field" x="140" y="915" width="150" height="48"/>
    <rect class="field" x="610" y="915" width="150" height="48"/>
    <text class="note" x="190" y="945">Cancel</text>
    <text class="note" x="650" y="945">Save story</text>
  </main>
</svg>
