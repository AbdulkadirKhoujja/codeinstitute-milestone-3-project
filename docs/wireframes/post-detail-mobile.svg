<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-labelledby="title description">
  <title id="title">ByteBoard mobile post detail wireframe</title>
  <desc id="description">Planning wireframe showing a stacked post, article link, voting, owner actions, comment form, and discussion on mobile.</desc>
  <style>
    .page { fill: #fff; stroke: #222; stroke-width: 2; }
    .region { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .card { fill: #fff; stroke: #777; stroke-width: 2; }
    .line { stroke: #888; stroke-width: 8; stroke-linecap: round; }
    .label { fill: #111; font: 700 15px Arial, sans-serif; }
    .note { fill: #333; font: 12px Arial, sans-serif; }
  </style>
  <rect class="page" x="1" y="1" width="388" height="998"/>
  <text class="note" x="16" y="20">PLANNING WIREFRAME — NOT FINAL</text>
  <rect class="region" x="12" y="32" width="366" height="55"/>
  <text class="label" x="28" y="66">BYTEBOARD</text>
  <text class="note" x="316" y="66">Menu</text>
  <text class="note" x="16" y="112">Home / Category / Story</text>

  <rect class="region" x="12" y="128" width="366" height="365"/>
  <text class="label" x="28" y="162">Post title wraps across lines</text>
  <text class="label" x="28" y="184">on small screens</text>
  <text class="note" x="28" y="216">Category · author</text>
  <text class="note" x="28" y="238">created · updated</text>
  <rect class="card" x="28" y="258" width="110" height="40"/>
  <text class="note" x="49" y="283">↑ 42 ↓</text>
  <rect class="card" x="218" y="258" width="60" height="40"/>
  <rect class="card" x="290" y="258" width="72" height="40"/>
  <text class="note" x="236" y="283">Edit</text>
  <text class="note" x="307" y="283">Delete</text>
  <line class="line" x1="28" y1="330" x2="350" y2="330"/>
  <line class="line" x1="28" y1="354" x2="336" y2="354"/>
  <line class="line" x1="28" y1="378" x2="310" y2="378"/>
  <line class="line" x1="28" y1="402" x2="345" y2="402"/>
  <rect class="card" x="28" y="430" width="190" height="40"/>
  <text class="note" x="46" y="455">Read original article ↗</text>

  <text class="label" x="16" y="535">Join the discussion</text>
  <rect class="region" x="12" y="552" width="366" height="135"/>
  <rect class="card" x="26" y="570" width="338" height="70"/>
  <rect class="card" x="250" y="648" width="114" height="28"/>
  <text class="note" x="270" y="668">Add comment</text>

  <text class="label" x="16" y="726">Comments</text>
  <rect class="card" x="12" y="742" width="366" height="105"/>
  <text class="note" x="28" y="770">Author · date</text>
  <line class="line" x1="28" y1="800" x2="350" y2="800"/>
  <line class="line" x1="28" y1="824" x2="300" y2="824"/>
  <rect class="card" x="12" y="862" width="366" height="105"/>
  <text class="note" x="28" y="890">Author · date · owner actions</text>
  <line class="line" x1="28" y1="920" x2="350" y2="920"/>
  <line class="line" x1="28" y1="944" x2="285" y2="944"/>
</svg>
