<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">ByteBoard profile wireframe</title>
  <desc id="description">Planning wireframe showing member identity, create-story action, owned-post status filters, and manageable post cards.</desc>
  <style>
    .page { fill: #fff; stroke: #222; stroke-width: 2; }
    .region { fill: #f2f2f2; stroke: #555; stroke-width: 2; }
    .card { fill: #fff; stroke: #777; stroke-width: 2; }
    .line { stroke: #888; stroke-width: 9; stroke-linecap: round; }
    .label { fill: #111; font: 700 18px Arial, sans-serif; }
    .note { fill: #333; font: 15px Arial, sans-serif; }
  </style>
  <rect class="page" x="1" y="1" width="1198" height="898"/>
  <text class="note" x="28" y="30">PLANNING WIREFRAME — NOT A FINAL SCREENSHOT</text>
  <rect class="region" x="25" y="50" width="1150" height="75"/>
  <text class="label" x="55" y="95">BYTEBOARD</text>
  <text class="note" x="880" y="95">Search · Account · Sign out</text>

  <main>
    <rect class="region" x="75" y="165" width="1050" height="130"/>
    <text class="label" x="110" y="215">Member profile: username</text>
    <text class="note" x="110" y="250">Non-sensitive account summary</text>
    <rect class="card" x="890" y="205" width="190" height="50"/>
    <text class="note" x="930" y="237">Create a story</text>

    <text class="label" x="75" y="350">My posts</text>
    <rect class="card" x="870" y="325" width="120" height="40"/>
    <rect class="card" x="1005" y="325" width="120" height="40"/>
    <text class="note" x="900" y="350">Drafts</text>
    <text class="note" x="1026" y="350">Published</text>

    <g transform="translate(75 390)">
      <rect class="region" width="1050" height="150"/>
      <text class="label" x="30" y="40">Owned post title</text>
      <text class="note" x="30" y="72">Draft · category · updated date</text>
      <line class="line" x1="30" y1="105" x2="680" y2="105"/>
      <rect class="card" x="790" y="85" width="95" height="40"/>
      <rect class="card" x="900" y="85" width="115" height="40"/>
      <text class="note" x="820" y="110">Edit</text>
      <text class="note" x="928" y="110">Delete</text>
    </g>
    <g transform="translate(75 565)">
      <rect class="region" width="1050" height="150"/>
      <text class="label" x="30" y="40">Owned post title</text>
      <text class="note" x="30" y="72">Published · category · updated date</text>
      <line class="line" x1="30" y1="105" x2="680" y2="105"/>
      <rect class="card" x="680" y="85" width="95" height="40"/>
      <rect class="card" x="790" y="85" width="95" height="40"/>
      <rect class="card" x="900" y="85" width="115" height="40"/>
      <text class="note" x="707" y="110">View</text>
      <text class="note" x="820" y="110">Edit</text>
      <text class="note" x="928" y="110">Delete</text>
    </g>

    <rect class="region" x="75" y="755" width="1050" height="80"/>
    <text class="note" x="360" y="802">Empty state occupies this region when no posts match.</text>
  </main>
</svg>
